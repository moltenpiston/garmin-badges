name: Update Garmin Badges

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  update-badges:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install garminconnect garth

      - name: Run badge fetcher
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKEN: ${{ secrets.GARMIN_TOKEN }}
        run: python get_badges.py

      - name: Commit changes (if any)
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add badges.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica, skip commit."
          else
            git commit -m "Aggiornamento badge e sfide Garmin"
            git push
          fi
